[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-assistant"
version = "0.1.0"
description = "Retrieval-augmented assistant for Singapore fund management company compliance (document register layer)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "pypdf>=5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
embed = ["sentence-transformers>=3"]   # local open-source embeddings (BGE etc.); large download
llm = ["anthropic>=0.40"]              # hosted Claude for answering

[project.scripts]
register = "compliance_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
